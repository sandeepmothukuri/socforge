name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socforge
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: socforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Authoritative Dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          cd apps/api
          ruff check .

      - name: Run Mypy Type Check
        run: |
          cd apps/api
          mypy socforge

      - name: Run Backend Tests
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-32-chars-long-for-testing!!
          DATABASE_URL: postgresql+asyncpg://socforge:testpassword123@localhost:5432/socforge_test
          REDIS_URL: redis://localhost:6379/0
          FIRST_ADMIN_EMAIL: admin@socforge.local
          FIRST_ADMIN_PASSWORD: TestPassword123!
        run: |
          cd apps/api
          pytest -v

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies Deterministically
        run: |
          cd apps/web
          npm ci

      - name: Run Frontend Lint
        run: |
          cd apps/web
          npm run lint

      - name: Run Frontend Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: |
          cd apps/web
          npm run build

  docker-builds:
    name: Container Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build API Docker Image
        run: |
          docker build -f deployments/docker/Dockerfile.api -t socforge-api:ci .

      - name: Build Web Docker Image
        run: |
          docker build -f deployments/docker/Dockerfile.web -t socforge-web:ci .
