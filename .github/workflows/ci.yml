name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  DATABASE_URL: "postgresql+asyncpg://socforge:socforge@localhost:5432/socforge_test"
  ALEMBIC_DATABASE_URL: "postgresql+psycopg2://socforge:socforge@localhost:5432/socforge_test"
  REDIS_URL: "redis://localhost:6379/0"
  SECRET_KEY: "ci-test-secret-key-not-used-in-production"
  APP_ENV: "test"
  AI_PROVIDER: "mock"
  DEFAULT_ADMIN_EMAIL: "admin@socforge.local"
  DEFAULT_ADMIN_PASSWORD: "ci-admin-password"

jobs:
  # ─────────────────────────────────────────────────────────────
  api-checks:
    name: API — Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socforge
          POSTGRES_PASSWORD: socforge
          POSTGRES_DB: socforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install psycopg2-binary  # needed for alembic sync runner
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check socforge tests

      - name: Ruff format check
        run: ruff format --check socforge tests

      - name: Mypy type check
        run: mypy socforge --ignore-missing-imports --no-error-summary
        continue-on-error: true  # Non-blocking until stubs coverage improves

      - name: Run Alembic migrations on fresh DB
        run: |
          DATABASE_URL="$ALEMBIC_DATABASE_URL" alembic upgrade head
        env:
          DATABASE_URL: ${{ env.ALEMBIC_DATABASE_URL }}

      - name: Verify migration idempotence (upgrade head twice)
        run: |
          DATABASE_URL="$ALEMBIC_DATABASE_URL" alembic upgrade head
        env:
          DATABASE_URL: ${{ env.ALEMBIC_DATABASE_URL }}

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration -v --tb=short
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}

      - name: Run security tests
        run: pytest tests/security -v --tb=short
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}

      - name: Verify CLI commands
        run: |
          pip install -e ../cli
          python -m socforge_cli.main --help

  # ─────────────────────────────────────────────────────────────
  web-checks:
    name: Web — Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: ESLint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ─────────────────────────────────────────────────────────────
  docker-builds:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f deployments/docker/Dockerfile.api -t socforge-api:ci .

      - name: Build Web image
        run: docker build -f deployments/docker/Dockerfile.web -t socforge-web:ci .

      - name: Verify API image runs as non-root
        run: |
          USER_ID=$(docker run --rm --entrypoint id socforge-api:ci -u)
          echo "Container user ID: $USER_ID"
          [ "$USER_ID" != "0" ] || (echo "ERROR: API container running as root" && exit 1)
