name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd apps/api
          pip install --upgrade pip
          pip install hatchling pytest pytest-asyncio pyyaml python-jose passlib bcrypt pydantic pydantic-settings ruff structlog rich httpx fastapi

      - name: Run Ruff Lint
        run: |
          cd apps/api
          ruff check .

      - name: Run Unit Tests
        run: |
          cd apps/api
          pytest tests/unit -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
