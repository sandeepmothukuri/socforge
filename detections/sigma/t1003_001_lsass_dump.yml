title: LSASS Memory Dump and Credential Access
id: 5b7d90e2-8b63-4b68-b8f4-2f22c1db55c1
status: test
description: Detects process access and memory dumping targeting the Local Security Authority Subsystem Service (LSASS)
author: Sandeep Mothukuri
references:
  - https://attack.mitre.org/techniques/T1003/001/
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_tools:
    Image|contains:
      - mimikatz
      - procdump
      - comsvcs.dll
      - rundll32.exe
  selection_cmdline:
    CommandLine|contains:
      - sekurlsa
      - MiniDump
      - comsvcs
      - lsass
  condition: selection_tools and selection_cmdline
falsepositives:
  - Legitimate administrative diagnostics using ProcDump
level: critical
