title: Suspicious Local Account Creation
id: f1a2b3c4-d5e6-47a8-9b0c-1d2e3f4a5b6c
status: test
description: Detects the creation of unauthorized local user accounts using net.exe or PowerShell cmdlets
author: Sandeep Mothukuri
references:
  - https://attack.mitre.org/techniques/T1136/001/
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_net:
    Image|contains:
      - net.exe
      - net1.exe
    CommandLine|contains:
      - user /add
      - user add
  selection_pwsh:
    Image|contains:
      - powershell.exe
      - pwsh.exe
    CommandLine|contains:
      - New-LocalUser
  condition: selection_net or selection_pwsh
falsepositives:
  - Provisioning of new developer or admin systems
level: high
