[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socforge-api"
version = "0.1.0"
description = "SOCForge API — Evidence-driven security operations platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sandeep Mothukuri" }]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.12",
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "httpx>=0.28.0",
  "structlog>=24.4.0",
  "rich>=13.9.0",
  "pyyaml>=6.0.2",
  "python-dateutil>=2.9.0",
  "uuid7>=0.1.0",
  "orjson>=3.10.0",
  "slowapi>=0.1.9",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-pyyaml>=6.0.12",
  "types-python-dateutil>=2.9.0",
  "factory-boy>=3.3.0",
  "faker>=33.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["socforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["socforge", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["socforge"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["socforge"]
omit = ["*/migrations/*", "*/alembic/*"]
